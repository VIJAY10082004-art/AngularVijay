<form #form="ngForm" (ngSubmit)="handleSubmit(form)">
<div><label for="UserName">USERNAME</label>
    <input type="text" name="UserName" id="UserName"
    #username="ngModel" [(ngModel)]="UserName"
    minlength="5"></div>
<div>
    <label for="Email">EMAIL ID</label>
    <input type="email" name="Email" id="Email" [(ngModel)]="Email"
    #email="ngModel"></div>


<div>
    <label for="PhoneNo">PHONENO</label>
    <input type="text" name="PhoneNo" id="PhoneNo"
    [(ngModel)]="PhoneNo"
    
    #phoneno="ngModel" minlength="10" maxlength="10">
    
</div>
<div>
    <label for="Name">NAME</label>
    <input type="text" name="Name" id="Name"
    [(ngModel)]="Name"
    #name="ngModel">
</div>
<div>
<label for="Password">PASSWORD</label>
    <input type="text" name="Password" id="Password"
    [(ngModel)]="PasswordEnter"
    #password="ngModel"
    minlength="8"
    
 >
 @if (password.getError('minlength')) {
    <p>Please valid 8</p>
 }
</div>


  <button type="submit">Submit</button>


</form>
